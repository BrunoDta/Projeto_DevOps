---
- name: Preparar ambiente do simulador de estoque
  hosts: simulador
  become: true

  vars:
    app_user: devops
    app_dir: /opt/supermercado
    simulador_dir: /opt/supermercado/simulador
    dados_dir: /opt/supermercado/dados

  tasks:
    - name: Instalar Python e utilitários
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Criar diretórios da aplicação e dos dados
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ simulador_dir }}"
        - "{{ dados_dir }}"
